name: Container Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1' # Weekly on Monday at 05:30 UTC

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          for attempt in 1 2 3; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o closedsspm ./cmd/closedsspm && \
              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o closedsspm-mcp ./cmd/mcp && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 5))
          done
          mkdir -p linux/amd64
          mv closedsspm closedsspm-mcp linux/amd64/

      - name: Build Docker image
        run: docker build --build-arg TARGETPLATFORM=linux/amd64 -t closedsspm:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: closedsspm:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          exit-code: 1

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: trivy-results.sarif

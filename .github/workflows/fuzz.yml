name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 3:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz:
    name: Go Fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Fuzz YAML policy loading
        run: go test -fuzz=FuzzLoadPoliciesYAML -fuzztime=3m -run='^$' ./internal/policy/

      - name: Fuzz field condition matching
        run: go test -fuzz=FuzzMatchesFieldConditions -fuzztime=3m -run='^$' ./internal/policy/

      - name: Upload crash artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashers
          path: internal/policy/testdata/fuzz/
          retention-days: 30

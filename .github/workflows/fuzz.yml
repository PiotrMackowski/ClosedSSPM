name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 3:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz:
    name: Go Fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Fuzz YAML policy loading
        run: go test -fuzz=FuzzLoadPoliciesYAML -fuzztime=3m -run='^$' ./internal/policy/

      - name: Fuzz field condition matching
        run: go test -fuzz=FuzzMatchesFieldConditions -fuzztime=3m -run='^$' ./internal/policy/

      - name: Upload crash artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashers
          path: internal/policy/testdata/fuzz/
          retention-days: 30
